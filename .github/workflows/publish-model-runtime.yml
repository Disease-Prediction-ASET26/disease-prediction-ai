name: Publish model runtime

on:
  push:
    tags:
      - model-runtime-dev-*
      - model-runtime-prod-*
  workflow_dispatch:
    inputs:
      channel:
        description: Runtime release channel
        required: true
        type: choice
        options:
          - dev
          - prod
      ai_base_image:
        description: Matching AI base image pinned by sha256 digest (manual runs only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: model-runtime-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'push' || (inputs.channel == 'dev' && github.ref == 'refs/heads/develop') || (inputs.channel == 'prod' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      image-ref: ${{ steps.publish.outputs.image-ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.18'

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve channel and pinned base image
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_BASE_IMAGE: ${{ inputs.ai_base_image }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            case "$REF_NAME" in
              model-runtime-dev-*) channel=dev; base_branch=develop; base_tag=develop ;;
              model-runtime-prod-*) channel=prod; base_branch=main; base_tag=main ;;
              *) echo "Unsupported model runtime tag." >&2; exit 1 ;;
            esac
            comparison_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_REVISION...$base_branch" --jq '.status')"
            [[ "$comparison_status" == "ahead" || "$comparison_status" == "identical" ]]
            if [[ "$channel" == "dev" ]]; then
              base_repo=ghcr.io/disease-prediction-aset26/disease-prediction-ai-dev
            else
              base_repo=ghcr.io/disease-prediction-aset26/disease-prediction-ai
            fi
            base_digest="$(docker buildx imagetools inspect "$base_repo:$base_tag" | awk '/^Digest:/ {print $2; exit}')"
            [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            base_image="$base_repo@$base_digest"
          else
            channel="$INPUT_CHANNEL"
            base_image="$INPUT_BASE_IMAGE"
            case "$channel" in
            dev)
              [[ "$base_image" == ghcr.io/disease-prediction-aset26/disease-prediction-ai-dev@sha256:* ]]
              ;;
            prod)
              [[ "$base_image" == ghcr.io/disease-prediction-aset26/disease-prediction-ai@sha256:* ]]
              ;;
            *) echo "Channel must be dev or prod." >&2; exit 1 ;;
            esac
            [[ "$base_image" =~ @sha256:[0-9a-f]{64}$ ]]
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "base_image=$base_image" >> "$GITHUB_OUTPUT"
          {
            echo "## Runtime release inputs"
            echo
            echo "- Channel: \`$channel\`"
            echo "- Base image: \`$base_image\`"
            echo "- Source revision: \`$SOURCE_REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download the pinned training dataset
        run: |
          set -euo pipefail
          mkdir -p data
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/itachi9604/healthcare-chatbot/e4194028a436f6e9beed56bea6f424018734a651/Data/dataset.csv \
            --output /tmp/disease-symptom-dataset.csv
          python - <<'PY'
          from pathlib import Path

          source = Path("/tmp/disease-symptom-dataset.csv").read_bytes()
          blank_header, separator, rows = source.partition(b"\n")
          if separator != b"\n" or blank_header != b"," * 17:
              raise SystemExit("Unexpected pinned dataset mirror format.")

          header = (
              "Disease,"
              + ",".join(f"Symptom_{number}" for number in range(1, 18))
              + "\n"
          ).encode()
          Path("data/dataset.csv").write_bytes(header + rows)
          PY
          echo "ebbd391c4ba4d64f57a00eb3d0a55f0ca9b920b0c5de6b9af4234e72519c9618  data/dataset.csv" | sha256sum --check

      - name: Train and record the reviewed classifier candidate
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir scikit-learn==1.9.1
          python -m prediction_service.train \
            --data data/dataset.csv \
            --out models \
            --source-revision "$SOURCE_REVISION" | tee /tmp/training-summary.txt
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          manifest = json.loads(Path("models/best.manifest.json").read_text())
          print("## Classifier candidate")
          print()
          print(f"- Model version: `{manifest['model_version']}`")
          print(f"- Selected strategy: `{manifest['training']['selected_strategy']}`")
          print(f"- Held-out scores: `{json.dumps(manifest['training']['held_out_accuracy'], sort_keys=True)}`")
          print(f"- Dataset SHA-256: `{manifest['training']['dataset_sha256']}`")
          print()
          PY

      - name: Install pinned Trivy
        run: |
          set -euo pipefail
          mkdir -p /tmp/disease-prediction-tools
          curl --fail --location --silent --show-error \
            https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz \
            --output /tmp/trivy.tar.gz
          echo "8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9  /tmp/trivy.tar.gz" | sha256sum --check
          tar -xzf /tmp/trivy.tar.gz -C /tmp/disease-prediction-tools trivy
          echo /tmp/disease-prediction-tools >> "$GITHUB_PATH"

      - name: Build, scan, and publish the immutable runtime image
        id: publish
        run: |
          set -euo pipefail
          scripts/publish-model-runtime.sh \
            "${{ steps.target.outputs.channel }}" \
            "${{ steps.target.outputs.base_image }}" \
            | tee /tmp/publish-summary.txt
          cat /tmp/publish-summary.txt >> "$GITHUB_STEP_SUMMARY"

  update-gitops:
    name: open Oracle dev image update
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/model-runtime-dev-')) || (github.event_name == 'workflow_dispatch' && inputs.channel == 'dev')) }}
    needs:
      - publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require GitOps app credentials
        env:
          APP_ID: ${{ secrets.GITOPS_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$PRIVATE_KEY" ]]; then
            echo "::error::Set GITOPS_CLIENT_ID and GITOPS_APP_PRIVATE_KEY before publishing a dev runtime."
            exit 1
          fi

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: gitops-token
        with:
          client-id: ${{ secrets.GITOPS_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: Disease-Prediction-ASET26
          repositories: disease-prediction-gitops
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Disease-Prediction-ASET26/disease-prediction-gitops
          ref: main
          token: ${{ steps.gitops-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - name: Pin the model runtime dev digest
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image-ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          image_ref = os.environ["IMAGE_REF"]
          expected = r"ghcr\.io/disease-prediction-aset26/disease-prediction-ai-runtime@sha256:[0-9a-f]{64}"
          if not re.fullmatch(expected, image_ref):
              raise SystemExit("Published digest does not match the model runtime package")

          path = Path("gitops/clusters/oracle/disease-prediction/deployments.yaml")
          text = path.read_text(encoding="utf-8")
          sections = text.split("\n---\n")
          matches = 0
          for index, section in enumerate(sections):
              if not re.search(r"(?m)^kind: Deployment$", section):
                  continue
              if not re.search(r"(?m)^  name: ai$", section):
                  continue
              lines = section.splitlines()
              image_lines = [i for i, line in enumerate(lines) if re.match(r"^\s+image:\s", line)]
              if len(image_lines) != 1:
                  raise SystemExit("Expected one image in the ai Deployment")
              line_index = image_lines[0]
              indent = re.match(r"^(\s+image:\s*)", lines[line_index]).group(1)
              lines[line_index] = indent + image_ref
              sections[index] = "\n".join(lines)
              matches += 1

          if matches != 1:
              raise SystemExit(f"Expected one ai Deployment, found {matches}")
          path.write_text("\n---\n".join(sections), encoding="utf-8")
          PY
          git -C gitops diff --check

      - name: Open or update the GitOps pull request
        env:
          GH_TOKEN: ${{ steps.gitops-token.outputs.token }}
          IMAGE_REF: ${{ needs.publish.outputs.image-ref }}
        run: |
          gh auth setup-git
          branch="automation/update-model-runtime-dev"
          git -C gitops config user.name "github-actions[bot]"
          git -C gitops config user.email "github-actions[bot]@users.noreply.github.com"
          git -C gitops switch -c "$branch"
          git -C gitops add clusters/oracle/disease-prediction/deployments.yaml
          if git -C gitops diff --cached --quiet; then
            echo "The Oracle dev manifest already uses this digest."
            exit 0
          fi
          git -C gitops commit -m "Update model runtime dev image digest"
          git -C gitops push --force origin "HEAD:refs/heads/$branch"

          title="Update model runtime dev image digest"
          body="The reviewed model-runtime workflow published ${IMAGE_REF}. Review and merge this pull request to let Argo CD sync the Oracle dev stack."
          number="$(gh pr list --repo Disease-Prediction-ASET26/disease-prediction-gitops --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --repo Disease-Prediction-ASET26/disease-prediction-gitops --title "$title" --body "$body"
          else
            gh pr create --repo Disease-Prediction-ASET26/disease-prediction-gitops --base main --head "$branch" --title "$title" --body "$body"
          fi
