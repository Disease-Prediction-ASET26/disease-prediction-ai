# Activation: https://github.com/Disease-Prediction-ASET26/disease-prediction-ci/blob/main/README.md
name: Preview cleanup
on:
  pull_request:
    branches:
    - main
    - develop
    types:
    - closed
  schedule:
  - cron: 47 3 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cleanup:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      }}
    uses: Disease-Prediction-ASET26/disease-prediction-ci/.github/workflows/preview-cleanup.yml@fa91ac76885b8cad6548bc1b3cf54682efefdf30 # multi-platform preview cleanup
    permissions:
      contents: read
      packages: write
      pull-requests: read
