# Activation: https://github.com/Disease-Prediction-ASET26/disease-prediction-ci/blob/main/README.md
name: CI
on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: Disease-Prediction-ASET26/disease-prediction-ci/actions/validate-workflows@964d17bd5d63d39a6cedf2a4c126a819cba5849e # updated shared summary
  secret-scan:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    uses: Disease-Prediction-ASET26/disease-prediction-ci/.github/workflows/secret-scan.yml@76e94bd640d92a3ffbf20e9cd5914e22b5ca40cd # shared secret scan
    permissions:
      contents: read
  lint:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt
    - run: |
        python -m pip install ruff==0.17.3
        ruff check --isolated prediction_service
  build:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt
    - run: |
        python -m compileall -q prediction_service
        echo "Prediction service source compiles successfully." >> "$GITHUB_STEP_SUMMARY"
  unit-test:
    if: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install CPU dependencies and test tools
      run: |
        python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
        python -m pip install -r requirements.txt
    - name: Run tests with coverage
      run: |
        mkdir -p reports
        python -m pytest tests --cov=prediction_service --cov-report=xml --junitxml=reports/junit.xml
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ always() }}
      with:
        name: ai-test-reports
        path: |
          coverage.xml
          reports/junit.xml
        retention-days: 3
        if-no-files-found: warn
  integration-test:
    if: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed') && false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - run: |
        echo "::error::Add integration tests and the command to run them."
        exit 1
  sonarqube:
    if: ${{ ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed') && (vars.SONAR_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
    - build
    - unit-test
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ai-test-reports
        path: .
    - name: Require SonarQube configuration
      env:
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        test -n "$SONAR_HOST_URL"
        test -n "$SONAR_PROJECT_KEY"
        test -n "$SONAR_TOKEN"
    - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
      env:
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: |
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.sources=prediction_service
          -Dsonar.qualitygate.wait=true
          -Dsonar.python.coverage.reportPaths=coverage.xml
  owasp:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.action != 'closed' }}
    needs:
    - build
    uses: Disease-Prediction-ASET26/disease-prediction-ci/.github/workflows/dependency-scan.yml@964d17bd5d63d39a6cedf2a4c126a819cba5849e # updated shared summary
    permissions:
      contents: read
      packages: read
    with:
      ecosystem: python
      build-artifact: ''
  containerize:
    name: containerize / scan
    if: ${{ !cancelled() && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
      == github.repository) && github.event.action != 'closed') && !contains(needs.*.result,
      'failure') && !contains(needs.*.result, 'cancelled') && needs['workflow-lint'].result == 'success' && needs['lint'].result
      == 'success' && needs['secret-scan'].result == 'success' && needs['build'].result == 'success' && needs['owasp'].result == 'success' && (!(vars.SONAR_ENABLED
      == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || needs.sonarqube.result
      == 'success') }}
    needs:
    - workflow-lint
    - secret-scan
    - lint
    - build
    - unit-test
    - integration-test
    - sonarqube
    - owasp
    uses: Disease-Prediction-ASET26/disease-prediction-ci/.github/workflows/container.yml@964d17bd5d63d39a6cedf2a4c126a819cba5849e # branch-selected dev and production images
    permissions:
      contents: read
      packages: write
      pull-requests: read
    with:
      build-artifact: ''
      dev-dockerfile: Dockerfile.dev
      production-dockerfile: Dockerfile.prod
  ci:
    if: ${{ always() && ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name ==
      github.repository || github.event.pull_request.base.ref == 'main') && github.event.action != 'closed') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
    - workflow-lint
    - secret-scan
    - lint
    - build
    - unit-test
    - integration-test
    - sonarqube
    - owasp
    - containerize
    steps:
    - name: Require develop promotion to main
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        REPOSITORY: ${{ github.repository }}
      run: |
        if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" && ( "$HEAD_REF" != "develop" || "$HEAD_REPO" != "$REPOSITORY" ) ]]; then
          echo "::error::PRs into main must come from this repository's develop branch."
          exit 1
        fi
    - uses: Disease-Prediction-ASET26/disease-prediction-ci/actions/ci-summary@964d17bd5d63d39a6cedf2a4c126a819cba5849e # updated shared summary
      with:
        needs: ${{ toJSON(needs) }}
        disabled: '{"integration-test": "The AI test suite is run in unit-test.", "sonarqube": "Main-only. Configure SONAR_HOST_URL, SONAR_PROJECT_KEY, SONAR_TOKEN and enable SONAR_ENABLED."}'
        enabled: ${{ format('["workflow-lint","secret-scan","lint","build","unit-test","owasp","containerize","{0}"]', (vars.SONAR_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
          github.event_name != 'pull_request') && 'sonarqube' || '') }}
